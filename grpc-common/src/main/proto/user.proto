syntax = "proto3";

option java_package = "com.ecommerce.grpc.user";
option java_multiple_files = true;

package user;

service UserService {
  rpc GetUser (UserRequest) returns (UserResponse);
}

message UserRequest {
  string userId = 1;
}

message UserResponse {
  string id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
}