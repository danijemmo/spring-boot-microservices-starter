spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: user-service
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        transport:
          protocol: smtp
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce?current_schema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/ecommerce}

server:
  port: 8082

keycloak:
  token-url: ${KEYCLOAK_TOKEN_URL:http://localhost:8080/realms/ecommerce/protocol/openid-connect/token}
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:ecommerce}
  client-id: ${KEYCLOAK_CLIENT_ID:ecommerce-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:0tP4Katqg8RIaA4siA6FpF0VmbkwvMVG}
  default-role: ROLE_USER

app:
  mail:
    from: no-reply@ecommerce.local
  security:
    password-reset-token-ttl-minutes: 15

grpc:
  server:
    port: 9090

eureka:
  instance:
    metadata-map:
      grpc.port: 9090
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
